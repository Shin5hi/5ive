<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>5ive - UX Sample</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Welcome to 5ive</h1>
    <p>Sample accessible button component:</p>

    <!-- ✅ GOOD UX: Semantic button with proper labeling and focus handling -->
    <button type="button" class="btn" id="action-btn">
      Click Me (Accessible)
    </button>

    <div id="feedback" class="feedback" aria-live="polite"></div>

    <p><small>Try navigating to this button using the 'Tab' key.</small></p>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
