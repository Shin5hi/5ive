<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5ive - UX Sample</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f9fafb;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    /* Good UX: Clear focus styles for keyboard users */
    button:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }
    .btn {
      background-color: #2563eb;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      border: none;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .btn:active {
      background-color: #1e40af;
    }

    /* Toast Notification Styles */
    #toast-container {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }

    .toast {
      background-color: #1f2937;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      font-size: 0.875rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(1rem);
      animation: toast-enter 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: auto;
    }

    @keyframes toast-enter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes toast-exit {
      to {
        opacity: 0;
        transform: translateY(1rem);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to 5ive</h1>
    <p>Sample accessible button component:</p>

    <!-- ✅ GOOD UX: Semantic button with proper labeling and focus handling -->
    <button type="button" class="btn" onclick="showToast('Action triggered!')">
      Click Me (Accessible)
    </button>

    <p><small>Try navigating to this button using the 'Tab' key.</small></p>
  </div>

  <!-- Accessible Toast Container -->
  <div id="toast-container" aria-live="polite"></div>

  <script>
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;

      container.appendChild(toast);

      // Remove after 5000ms to allow enough reading time
      setTimeout(() => {
        toast.style.animation = 'toast-exit 0.3s ease-in forwards';
        toast.addEventListener('animationend', () => {
          if (container.contains(toast)) {
            container.removeChild(toast);
          }
        });
      }, 5000);
    }
  </script>
</body>
</html>
